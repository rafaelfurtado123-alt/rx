name: nefron
description: "Néfron — Prontuário Eletrônico Nefrológico (Flutter web + mobile + tablet)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # UI / gráficos
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  # Estado e navegação
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  # Plataforma / backend
  supabase_flutter: ^2.5.6
  dio: ^5.6.0
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  # Utilidades
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
