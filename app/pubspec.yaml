name: nefron
description: "Néfron — Prontuário Eletrônico Nefrológico (Flutter web + mobile + tablet)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # UI / gráficos
  fl_chart: ^0.68.0
  # Estado e navegação
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  # Plataforma / backend
  supabase_flutter: ^2.5.6
  dio: ^5.6.0
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  # Utilidades
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # Fontes empacotadas localmente (sem CDN externo — disponibilidade offline,
  # CSP restrito e privacidade/LGPD): IBM Plex Sans (UI) + IBM Plex Mono
  # (números clínicos, tabular).
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
