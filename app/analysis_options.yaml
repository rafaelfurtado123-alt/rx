include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

# Regras de estilo agressivas (require_trailing_commas, prefer_const_constructors)
# ficam de fora: geram centenas de infos sem valor de revisão. O conjunto padrão
# do flutter_lints cobre erros e más práticas reais.
linter:
  rules:
    always_declare_return_types: true
