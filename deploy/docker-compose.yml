# =============================================================================
# Néfron — Deploy em VPS (Hostinger KVM ou similar) via Docker Compose
# =============================================================================
# Sobe: PostgreSQL 16 → migrações (uma vez) → API FastAPI → nginx servindo o
# app Flutter web + proxy /api. Ver docs/08-deploy-hostinger.md.
#
#   cp deploy/.env.example deploy/.env   # e ajuste os segredos
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# =============================================================================

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nefron
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no deploy/.env}
      POSTGRES_DB: nefron
    volumes:
      - nefron_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nefron"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Aplica o schema e as migrações na ordem (idempotente na 1ª execução;
  # re-execuções param no primeiro erro de objeto já existente — remova o
  # serviço após o bootstrap ou use `--profile bootstrap`).
  migrate:
    image: postgres:16
    profiles: ["bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ../db:/migrations:ro
    entrypoint: >
      bash -c "
        psql -h db -U nefron -d nefron -c \"create schema if not exists auth\";
        psql -h db -U nefron -d nefron -c \"create or replace function auth.uid() returns uuid as 'select gen_random_uuid()' language sql stable\";
        for f in schema.sql auth_fastapi_columns.sql rls_fastapi_context.sql \
                 seed.sql interacoes.sql escala.sql vidaas.sql receitas.sql \
                 ambulatorio.sql; do
          echo \"== db/$$f ==\";
          psql -h db -U nefron -d nefron -v ON_ERROR_STOP=1 -f /migrations/$$f || exit 1;
        done"
    restart: "no"

  api:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEFRON_ENVIRONMENT: production
      NEFRON_DATABASE_URL: postgresql+asyncpg://nefron:${DB_PASSWORD}@db:5432/nefron
      NEFRON_JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no deploy/.env}
      NEFRON_CORS_ORIGINS: '["https://${DOMAIN}"]'
      # VIDaaS (deixe vazio para o modo simulado)
      NEFRON_VIDAAS_CLIENT_ID: ${VIDAAS_CLIENT_ID:-}
      NEFRON_VIDAAS_CLIENT_SECRET: ${VIDAAS_CLIENT_SECRET:-}
      NEFRON_VIDAAS_REDIRECT_URI: https://${DOMAIN}/api/v1/assinatura/vidaas/callback
    expose:
      - "8000"

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro   # build do Flutter (deploy/build_web.sh)

volumes:
  nefron_pgdata:
